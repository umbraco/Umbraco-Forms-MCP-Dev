trigger:
  branches:
    include:
    - main
    - dev
    - v*/main
    - v*/dev
    - feature/*

resources:
  repositories:
  - repository: build
    type: github
    name: Umbraco/Umbraco.Build
    endpoint: github.com_umbraco

parameters:
  - name: sbom_generate
    displayName: Generate SBOM
    type: boolean
    default: false

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '22.x'
  # Dependency-Track product name
  - name: productName
    value: 'Umbraco.Forms.Mcp-Dev'
  - name: myGetRegistry
    value: 'https://www.myget.org/F/umbracoprereleases/npm/'
  # npm-type service connection in ADO holding the MyGet API key.
  - name: myGetServiceConnection
    value: 'NPM MyGet Prereleases Feed'

stages:
- stage: BuildAndTest
  displayName: 'Build'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: 'node_modules'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run compile
      displayName: 'Type-check TypeScript'

    - script: npm run build
      displayName: 'Build TypeScript'

    - script: npm pack --pack-destination $(Build.ArtifactStagingDirectory)
      displayName: 'Create NPM package'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish NPM package to artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'npm-package'

# Runs in parallel with the build and gates both release stages: a failed SBOM (e.g. a license policy
# violation) must stop a publish. Runs on v17/main, or on any branch when sbom_generate is set (a forced
# run is not flagged isLatest in Dependency-Track).
- stage: GenerateSBOM
  displayName: Generate SBOM
  dependsOn: []
  condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/v17/main'), eq('${{ parameters.sbom_generate }}', 'true'))
  variables:
  - group: dependency-track
  jobs:
  - job: GenerateSBOM
    displayName: Generate SBOM
    steps:
    - template: devops/templates/generate-sbom-template.yml@build
      parameters:
        sbom_nuget: false
        sbom_npm_paths: ['.']
        sbom_version_from: package.json # v<major> of package.json, e.g. 17.6.1-beta.6 -> v17
        # a run forced with sbom_generate must not displace the latest version in Dependency-Track
        ${{ if eq(parameters.sbom_generate, true) }}:
          sbom_is_latest: 'false'

- stage: Deploy_Prerelease
  displayName: Prerelease (MyGet)
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/v17/main'))
  dependsOn:
    - BuildAndTest
    - GenerateSBOM
  jobs:
    - job: Publish
      displayName: Push to MyGet
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'npm-package'
        - bash: echo "registry=$(myGetRegistry)" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/npm-package
          displayName: Point .npmrc at MyGet feed
        - task: npmAuthenticate@0
          displayName: Authenticate with MyGet
          inputs:
            workingFile: $(Pipeline.Workspace)/npm-package/.npmrc
            customEndpoint: '$(myGetServiceConnection)'
        - script: |
            # Find the first .tgz file in the current directory
            files=( ./*.tgz )

            # Extract version from package.json in the tarball
            tar -tf "${files[0]}" | grep package/package.json | head -1 | xargs tar -xf "${files[0]}" --strip-components=1
            version=$(node -p "require('./package.json').version")

            # Determine release channel from the version suffix, and publish under
            # the matching lts-17 dist-tag: this is the Umbraco 17 line, so it must
            # never claim alpha/beta/rc/latest, which belong to main (Umbraco 18).
            if [[ "${version}" == *"alpha"* ]]; then
              tag="lts-17-alpha"
            elif [[ "${version}" == *"beta"* ]]; then
              tag="lts-17-beta"
            elif [[ "${version}" == *"rc"* ]]; then
              tag="lts-17-rc"
            else
              tag="lts-17"
            fi

            echo "Publishing version ${version} to MyGet ($(myGetRegistry)) with tag ${tag}"
            if ! npm publish "${files[0]}" --registry $(myGetRegistry) --tag "${tag}"; then
              echo "##vso[task.logissue type=error]MyGet publish failed for version ${version}"
              exit 1
            fi
          displayName: Push package to MyGet
          workingDirectory: $(Pipeline.Workspace)/npm-package

- stage: Deploy_Npm
  displayName: Npm release
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/v17/main'))
  dependsOn:
    - BuildAndTest
    - GenerateSBOM
  jobs:
    - job: Publish
      displayName: Push to NPM
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'npm-package'
        - bash: echo "registry=https://registry.npmjs.org" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/npm-package
          displayName: Add registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with npm
          inputs:
            workingFile: $(Pipeline.Workspace)/npm-package/.npmrc
            customEndpoint: "NPM - Umbraco Forms"
        - script: |
            # Setup temp npm project to load in defaults from the local .npmrc
            npm init -y

            # Find the first .tgz file in the current directory
            files=( ./*.tgz )

            # Extract version from package.json in the tarball
            tar -tf "${files[0]}" | grep package/package.json | head -1 | xargs tar -xf "${files[0]}" --strip-components=1
            version=$(node -p "require('./package.json').version")

            # Determine release channel from version. This is the Umbraco 17 line,
            # so publish under lts-17 dist-tags and never claim alpha/beta/rc/latest,
            # which belong to main (Umbraco 18).
            if [[ "${version}" == *"alpha"* ]]; then
              channel="lts-17-alpha"
            elif [[ "${version}" == *"beta"* ]]; then
              channel="lts-17-beta"
            elif [[ "${version}" == *"rc"* ]]; then
              channel="lts-17-rc"
            else
              channel="lts-17"
            fi

            echo "Publishing version ${version} with tag ${channel}"
            if ! npm publish "${files[0]}" --tag $channel --access public; then
              echo "##vso[task.logissue type=error]npm publish failed for version ${version}"
              exit 1
            fi
          displayName: Push to npm with dynamic tagging
          workingDirectory: $(Pipeline.Workspace)/npm-package

